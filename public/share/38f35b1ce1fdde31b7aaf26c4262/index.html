<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Shared presentation</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0}body{background:white;color:#263a46;font:16px system-ui,sans-serif}main{padding:1.3rem}p{margin:0}iframe{display:block}body:has(iframe)>main{display:none}</style>
</head><body><main><p id="status" role="status">Opening shared presentation…</p></main>
<script>
(async()=>{
  'use strict';
  const status=document.getElementById('status');
  const keyText=location.hash.slice(1);
  if (!/^[0-9a-f]{64}$/i.test(keyText)) {
    status.textContent='Open this page with the complete link from the presenter.';return;
  }
  const params=new URLSearchParams(location.search);
  const embedded=params.get('office')==='1';
  if(embedded) {
    const office=document.createElement('script');
    office.src='https://appsforoffice.microsoft.com/lib/1/hosted/office.js';
    office.onload=()=>{if(window.Office)window.Office.onReady(()=>{});};
    document.head.append(office);
  }
  try {
    const response=await fetch('./content.bin',{credentials:'omit',referrerPolicy:'no-referrer'});
    if(!response.ok)throw Error('Unavailable');
    const bytes=new Uint8Array(await response.arrayBuffer());
    const rawKey=Uint8Array.from(keyText.match(/../g),v=>parseInt(v,16));
    const key=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
    const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));
    const bundle=JSON.parse(new TextDecoder().decode(decrypted));
    const allowed=['dense','tx','rx','both'],example=params.get('example');
    let html=bundle.html.replace('<head>', '<head><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">');
    if(allowed.includes(example)) html=html.replace("new URLSearchParams(location.search).get('example')",JSON.stringify(example));
    if(embedded) html=html.replace('</head>','<style>'+bundle.compactCss+'</style></head>').replace('</body>','<script>'+bundle.compactJs+'<\/script></body>');
    const frame=document.createElement('iframe');
    frame.title='Aperture, resolution and contrast';
    frame.setAttribute('referrerpolicy','no-referrer');
    frame.setAttribute('sandbox','allow-scripts allow-popups allow-popups-to-escape-sandbox');
    frame.srcdoc=html;
    document.title=frame.title;
    document.body.append(frame);
  } catch {
    status.textContent='Unable to open the widget. Check your connection and use the complete link from the presenter.';
  }
})();
</script></body></html>
